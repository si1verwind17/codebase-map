name: Skill feedback
description: Something the skill got wrong or could not map. Usually filled in by the skill's send-feedback.
title: "[feedback] "
labels: [skill-feedback]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public and posted from your account. Read every field before you submit: it should hold no
        code, paths or names from your repository.
  - type: textarea
    id: report
    attributes:
      label: What happened
      description: What the map got wrong or left out, what you expected, and how the code involved is shaped, in general terms.
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: Map facts
      description: Versions, counts and the skill's own names, added by feedback.py. Leave empty when writing by hand.
