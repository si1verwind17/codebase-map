name: pages
on:
  push:
    branches: [main]
    paths: ["docs/**", "demo/parking-city/docs/viz-code/index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # the site: the field guide at /, the parking-city demo map at /demo/
      - run: |
          mkdir -p site/demo
          cp docs/field-guide.html site/index.html
          cp demo/parking-city/docs/viz-code/index.html site/demo/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
