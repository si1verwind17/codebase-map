<template class="page" data-title="Welcome" data-kicker="Start here">
  <figure class="pic" data-pic="welcome"></figure>
  <p class="cap">The skill's demo map: a small parking-city system, whole-system floor.</p>
  <p>This map shows how your code fits together, drawn as a factory. Each <b>service</b> is a factory building. The lines between buildings are the ways the code talks: a request, a stream, an event, a scheduled job, a read or write to a database.</p>
  <p>The map is made from your committed code only, and it is stamped with one commit. It shows what the code says, not what runs in production.</p>
  <div class="box">The guide covers <b>12 patterns</b>, one per page, each with the smallest example that shows it. Read it once before your own map; after that, the legend in the map is enough.</div>
  <p>Use <b>Next</b> or the → key to turn the page.</p>
</template>

<template class="page" data-title="Floors" data-kicker="Getting around">
  <figure class="pic" data-pic="floors"></figure>
  <p class="cap">Floor 0 of a tiny example: two factories, orders and billing, with a belt from orders to billing. Scroll in on orders to open its floor of five packages.</p>
  <p><b>Floor 0</b> is the whole system: every service, shared code on a shelf at the top, databases at the bottom, outside services on the right. Scroll in on a factory, or double-click it, to go inside; scroll out to come back up. Inside, the packages are the machines.</p>
  <p>The <b>Floors</b> list on the left shows where you are; click a floor to go back up. <b>Fit</b> shows the whole floor.</p>
</template>

<template class="page" data-title="Names and codes" data-kicker="Getting around">
  <figure class="pic" data-pic="codes"></figure>
  <p class="cap">Top, zoomed out on floor 0 and shown enlarged: the orders factory shows only its code, S1. Below, zoomed in on its file service.py: the class shows its code and its name, S1·P2·F2·C1 OrderService, and the doors name where its lines come from and go to, S1·P1 api and S1·P2·F1 rules.py.</p>
  <p>Every item has a short <b>code</b> that says where it is: <span class="code">S2</span> is a service, <span class="code">S2·P1</span> a package inside it, <span class="code">S2·P1·F3</span> a file in that package; <span class="code">C</span> is a class and <span class="code">M</span> a method. Databases are <span class="code">D</span>, libraries <span class="code">L</span>, outside services <span class="code">X</span>, topics <span class="code">T</span>.</p>
  <p>Zoomed out there is no room for names, so a machine shows only its code. Hover it, or zoom in, to see the name. <b>Find</b> takes a name or a code.</p>
</template>

<template class="page" data-title="Belt — a request" data-kicker="Pattern 1">
  <figure class="pic" data-pic="belt"></figure>
  <p class="cap">orders calls billing: a one-way belt, its chevrons pointing from orders to billing. billing and payments call each other: a two-way belt, chevrons both ways.</p>
  <p>A <b>belt</b> is a request: one part of the code calls another and waits for the answer — an HTTP or RPC call between services, or a plain method call inside one. The chevrons point from the caller to the one it calls.</p>
  <p>A belt with chevrons both ways is a <b>two-way belt</b>: the two call each other.</p>
</template>

<template class="page" data-title="Splitters and mergers" data-kicker="Pattern 2">
  <figure class="pic" data-pic="splitters"></figure>
  <p class="cap">orders calls billing, payments and shipping: its belts leave as one trunk and fork at splitters. Those three all call reports: their belts join at mergers on the way. Splitters and mergers are the yellow plates.</p>
  <p>When one part calls several others, their belts leave as one <b>trunk</b> and fork at a <b>splitter</b>. When several call the same part, they join at a <b>merger</b>. A trunk means "sends to those"; hover it to see how many lines and which kinds it carries.</p>
</template>

<template class="page" data-title="Pipe — a stream" data-kicker="Pattern 3">
  <figure class="pic" data-pic="pipe"></figure>
  <p class="cap">orders streams to tracking: a blue pipe with a flange at each joint.</p>
  <p>A <b>pipe</b> is a stream: data keeps flowing from one side to the other instead of one request and one answer.</p>
</template>

<template class="page" data-title="Drones — events" data-kicker="Pattern 4">
  <figure class="pic" data-pic="drones"></figure>
  <p class="cap">orders produces events to the order-events hub on the green airfield. billing and reports each consume them on their own pad, and each gets its own copy.</p>
  <p>A <b>drone</b> carries an event. The message broker is a green <b>airfield</b>; each topic is a <b>hub</b> in it. The producer launches from its <b>pad</b>; every consumer has its own pad and gets its own <b>copy</b>.</p>
  <p>Drones fly over the floor, so their dotted flight paths can cross anything.</p>
</template>

<template class="page" data-title="Queues and dead letters" data-kicker="Pattern 5">
  <figure class="pic" data-pic="queues"></figure>
  <p class="cap">orders enqueues to invoices, a work queue with a waiting stack; billing and payments take from it in turn. billing's failures fly red to invoices-dead, the red-marked hub beside it.</p>
  <p>A <b>work queue</b> is a hub with a <b>waiting stack</b>: each message goes to <b>one</b> of the workers, who take turns.</p>
  <p><b>Dead letters</b>: messages that failed fly in red to a red-marked hub beside their topic.</p>
</template>

<template class="page" data-title="Push and pull" data-kicker="Pattern 6">
  <figure class="pic" data-pic="push_pull"></figure>
  <p class="cap">Top, floor 0: orders produces to order-events; billing's push subscription lands on its yellow receiving dock; reports pulls, its drone flying out to the hub and back. Middle, inside billing: the dock's sign names the endpoint the push calls, POST /events. Bottom, inside reports: the puller's tag, group orders-reports · 3 replicas.</p>
  <p>With a <b>push</b> subscription the broker delivers to the service's yellow <b>receiving dock</b>, which names the endpoint it calls. With a <b>pull</b> subscription the service's drone flies out empty and comes back loaded.</p>
  <p>A tag on a consumer such as <span class="code">3 replicas</span> says how many copies of it run.</p>
</template>

<template class="page" data-title="Rail — batch jobs" data-kicker="Pattern 7">
  <figure class="pic" data-pic="rail"></figure>
  <p class="cap">A nightly job in jobs writes to billing: the rail yard beside jobs with its platform to billing, a train on the track, billing's station, and the schedule sign reading daily 02:00.</p>
  <p>A <b>rail</b> is a batch job: a cron job, or a job triggered to move data in bulk. Jobs leave from a <b>rail yard</b> beside the machine that runs them, one <b>platform</b> per destination with its job count. Each destination has a <b>station</b>.</p>
  <p>The <b>schedule sign</b> on the yard sums up when they run (<span class="code">3 jobs · daily 02:00</span>); hover it to list every job.</p>
</template>

<template class="page" data-title="Storage" data-kicker="Pattern 8">
  <figure class="pic" data-pic="storage"></figure>
  <p class="cap">orders calls billing and reports along belts. It reads and writes orders-db, and reports only reads it. orders writes files to the receipts bucket, whose box carries the container yard, and keeps a cache only it uses: the chest beside it.</p>
  <p>A database is a warehouse with a lane. A <b>tap</b> drops onto the lane: <span style="color:var(--red);font-weight:700">red</span> writes, <span style="color:var(--slate);font-weight:700">slate</span> reads; a pair does both.</p>
  <p>A cache used by one service is a <b>chest</b> next to it; a cache several services share sits in storage like a database. A bucket is a container yard; it is read and written by taps, like a database.</p>
</template>

<template class="page" data-title="The outside world" data-kicker="Pattern 9">
  <figure class="pic" data-pic="outside"></figure>
  <p class="cap">orders calls tax-api, a yellow dock on the right edge. payment-provider sends a webhook along a belt into billing's receiving dock. All three services call mail, so mail is the X1 tab on each of them.</p>
  <p>Services outside your repo (a payment provider, a cloud API) are yellow <b>docks</b> on the right edge. A <b>webhook</b> is a belt from the outside dock into your service's receiving dock.</p>
  <p>An outside service that three or more of yours call, and nothing else, is a small <b>tab</b> on each caller instead, so its lines do not cross the floor.</p>
</template>

<template class="page" data-title="Shared code" data-kicker="Pattern 10">
  <figure class="pic" data-pic="shared"></figure>
  <p class="cap">Left, floor 0: the library common on the shelf above orders. Right, inside orders: common is installed on the left wall, with a belt from the store package that calls it.</p>
  <p>Code with no deployment of its own is a <b>library</b>. On floor 0 libraries stand on the shelf at the top. Inside a factory, each library it uses is an installed unit on the left wall, with belts from the packages that call it.</p>
  <p><b>Code links</b> (floor tools, off by default) draws thin dotted conduits from each service to the code it uses. A dotted line between two machines means one <b>implements</b> the other.</p>
</template>

<template class="page" data-title="Crossings and guesses" data-kicker="Pattern 11">
  <figure class="pic" data-pic="crossings"></figure>
  <p class="cap">Four services. Where two belts cross between them, one passes under the other. The belt between payments and reports is inferred: its edge is dashed.</p>
  <p>Where two lines must cross, one <b>passes under</b>: you see a hood on the tile before and after.</p>
  <p>A <b>dashed edge</b> is inferred: the scanner reasoned that the line exists but did not see both ends in the code. Treat it as a guess. A <b>red dashed</b> straight line could not be routed: the connection is real, but no clear path was found for it.</p>
</template>

<template class="page" data-title="Layers" data-kicker="Pattern 12">
  <figure class="pic" data-pic="layers"></figure>
  <p class="cap">Inside orders, eight packages all call audit, which wears used by 8. Its layer, S1·P1, is open, so its eight lines show. The layers button, bottom right, shows its code and a badge.</p>
  <p>Some items are used by many others (8 or more). Their lines would bury the floor, so each gets its own <b>layer</b>, named by the item's code, here <span class="code">S1·P1</span>. The item wears a <b>used by N</b> badge.</p>
  <p>The <b>layers button</b> (bottom right) appears only on floors that have one. Pick a layer: its lines show on top, the rest fade. Esc or a click on empty floor goes back to the base.</p>
</template>

<template class="page" data-title="Selecting and comments" data-kicker="Using the map">
  <figure class="pic clip" data-pic="select"></figure>
  <p class="cap">Two factories: click orders to keep only what it touches, click empty floor to clear it, scroll in on orders to go inside, then scroll out to come back up.</p>
  <p>Click a machine to keep only what it touches; the panel on the right says what it is, where its code lives and what it connects to. A click on empty floor or Esc clears it.</p>
  <p><b>Scroll in</b> on a building to go inside it (or double-click it); <b>scroll out</b> past the whole floor to go back up a floor.</p>
  <p>Write a comment on anything, then <b>Save for the agent</b>. It saves <span class="code">export-comment.md</span> into <span class="code">docs/viz-code/</span>, next to <span class="code">code-map.json</span> (if your browser downloads it instead, move it there). The next time you run the skill, the agent reads it first.</p>
</template>

<template class="page" data-title="Traces" data-kicker="Using the map">
  <figure class="pic" data-pic="trace"></figure>
  <p class="cap">The pinned trace "a customer pays for an order": orders calls billing's create_invoice, which rounds through the common library (folded: 2 calls), writes the invoices table and calls payments. Below, create_invoice opened in the detail panel with its example request and response.</p>
  <p>A <b>trace</b> follows data from any box on the map: <b>upstream</b> to what feeds it and <b>downstream</b> to what it feeds. Select something and press <b>Trace</b> in the inspector. A method, table, topic or outside service starts from itself; a service, package or class from its entry points, else from the methods where lines cross its edge, and the head says so ("billing · service · 2 entry points"). A service also lists its entry points, each with its own Trace button. The screen splits: the floor stays above, the trace below. Drag the divider, or press <b>Maximize</b>.</p>
  <p>The floor and the trace show the same thing. Starting a trace clears the selection. Click any box on the floor and the trace starts there instead, in the same direction; click a line and it starts from both its ends; click the box the trace already starts from and nothing changes. One box wears the blue ring at a time: the row you clicked in the trace, else the trace's start. The inspector on the right shows that same item, so a comment you add there is about it.</p>
  <p>Boxes are services and libraries, with their methods inside; a table, topic or outside service is a box of its own. Inside a box a call goes down; to another box it goes right. Each method says what arrives: the parameter types going in, the return type coming back. Dashed arrows are guesses; ↺ marks a loop. Drag the background to move around; Ctrl+wheel or a pinch zooms, and <b>Fit trace</b> shows the whole trace.</p>
  <p>The trace starts two steps each way. <b>+</b> goes one step further. A method with more than five neighbours shows the total, then five, then <b>show all</b>. Calls into a shared library fold into one box until you open it. "Entry method not known" means the map only knows which service it reaches.</p>
  <p>Click a method or an arrow to see its <b>examples</b>: made-up values, one per entry point and one per data type, always labelled <span class="code">example values, not computed</span>. The floor rings the method you clicked, moving to it when it is out of sight; when it is on another floor the detail panel says which, the door that way is ringed, and <b>Show on floor</b> takes you there floor by floor. <b>Pin</b> keeps a trace in <b>Pinned traces</b> on the left; <b>Save for the agent</b> sends your pins with your comments. Esc closes the trace.</p>
</template>

<template class="page" data-title="Limits and keeping it current" data-kicker="Last page">
  <p><b>What the map can't do</b></p>
  <ul>
    <li>Very large repos may draw crowded or imperfectly.</li>
    <li>A tangled picture can be the code's own shape (a module doing too much), not a drawing fault.</li>
    <li>Dashed lines are guesses.</li>
    <li>It shows one commit (under the repo name, top left); later changes are not on it.</li>
  </ul>
  <p><b>Keeping it current</b></p>
  <ul>
    <li>Run the skill again. It rescans only what changed since that commit, then stamps the new one.</li>
    <li>Your saved comments are read first.</li>
  </ul>
  <p><b>How to run it</b></p>
  <ul>
    <li>Claude Code: <span class="code">/visualizing-codebases</span></li>
    <li>Any other agent: ask it to "map this repo with the visualizing-codebases skill".</li>
  </ul>
</template>

<script>
const pictures = JSON.parse(document.getElementById("pictures").textContent);
const pages = [...document.querySelectorAll("template.page")].map((t) => ({ t: t.dataset.title, k: t.dataset.kicker, body: t.content }));
const toc = document.getElementById("toc"), page = document.getElementById("page"), zoom = document.getElementById("zoom");
zoom.onclick = () => zoom.classList.remove("open");
let i = 0;
/** Fills a page's picture frame from the pictures block: stills side by side, or a looping clip. */
function fill(fig) {
  const p = pictures[fig.dataset.pic];
  if (p?.clip) {
    const v = document.createElement("video");
    Object.assign(v, { src: p.clip, autoplay: true, loop: true, muted: true, playsInline: true });
    v.setAttribute("aria-label", fig.nextElementSibling?.textContent ?? "");
    fig.append(v);
  } else if (p?.stills) {
    fig.classList.toggle("stack", !!p.stack);
    for (const s of p.stills) {
      const im = document.createElement("img");
      im.srcset = `${s.src} ${s.density}x`; im.alt = ""; im.title = "Click to see it at full size";
      im.onclick = () => { zoom.replaceChildren(im.cloneNode()); zoom.classList.add("open"); };
      fig.append(im);
    }
  } else {
    fig.innerHTML = `<div class="ph">Picture "${fig.dataset.pic}" is not rendered yet: run <b>npm run guide</b>.</div>`;
  }
}
pages.forEach((p, n) => {
  const li = document.createElement("li");
  li.innerHTML = `<button><span class="n">${n + 1}</span><span>${p.t}</span></button>`;
  li.firstChild.onclick = () => go(n);
  toc.appendChild(li);
});
function go(n) {
  zoom.classList.remove("open");
  i = Math.max(0, Math.min(pages.length - 1, n));
  const p = pages[i];
  page.innerHTML = `<div class="kicker">${p.k}</div><h2>${p.t}</h2>`;
  page.append(p.body.cloneNode(true));
  page.querySelectorAll("figure[data-pic]").forEach(fill);
  [...toc.querySelectorAll("button")].forEach((b, k) => b.classList.toggle("here", k === i));
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === pages.length - 1;
  document.getElementById("count").textContent = `${i + 1} / ${pages.length}`;
  document.querySelector(".sheet").scrollTop = 0;
}
document.getElementById("prev").onclick = () => go(i - 1);
document.getElementById("next").onclick = () => go(i + 1);
addEventListener("keydown", (e) => {
  if (e.key === "Escape") zoom.classList.remove("open");
  if (e.key === "ArrowRight") go(i + 1);
  if (e.key === "ArrowLeft") go(i - 1);
});
go(0);
</script>
</body>
</html>
