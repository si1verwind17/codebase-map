# Built-in pack: what the scanner knows about Go libraries. Same format as stack.yaml; stack.yaml adds to it.
# import paths are matched on `/` boundaries; the longest matching prefix names the kind (`cloud.google.com/go/pubsub`
# is an event, the rest of `cloud.google.com/go` a cloud SDK). Kept in code: the standard library is every path
# whose first segment has no dot (no host), so it is not listed in ignore; `database/sql` and `net/http` (client
# and server: kind http) are imports entries.
# routes (regex, each gated on its import; a `handler` group when the handler argument is a name, also inside one
# wrapping call such as `http.HandlerFunc(h)`): net/http `HandleFunc`/`Handle` (a Go 1.22 pattern
# `"GET /orders/{id}"` gives method and path), Gin and Echo (`r.GET("/x", h)`), Chi (`r.Get("/x", h)`). Gin/Echo
# `Group`, Chi `Route`/`Mount` are mounts (nested prefixes the agent composes).
# tables: gorm `func (T) TableName() string { return "x" }` (in the TableName method). No `when`: a model file
# often imports nothing; the regex needs the whole method shape (receiver, no arguments, `string`, a literal return).
# queues: in-process queue creation sites (`make(chan T)`; `chan struct{}` and `chan bool` are signals, not hand-offs; no `when`: channels are built in): candidates the agent confirms (SKILL.md § In-process queues).
go:
  imports:
  - {prefix: database/sql, kind: sql-db}
  - {prefix: github.com/jackc/pgx, kind: sql-db}
  - {prefix: github.com/lib/pq, kind: sql-db}
  - {prefix: gorm.io/gorm, kind: sql-db}
  - {prefix: gorm.io/driver, kind: sql-db}
  - {prefix: github.com/jmoiron/sqlx, kind: sql-db}
  - {prefix: cloud.google.com/go/bigquery, kind: sql-db}
  - {prefix: go.mongodb.org/mongo-driver, kind: doc-db}
  - {prefix: github.com/IBM/sarama, kind: event}
  - {prefix: github.com/Shopify/sarama, kind: event}
  - {prefix: github.com/segmentio/kafka-go, kind: event}
  - {prefix: github.com/rabbitmq/amqp091-go, kind: event}
  - {prefix: github.com/streadway/amqp, kind: event}
  - {prefix: cloud.google.com/go/pubsub, kind: event}
  - {prefix: github.com/redis/go-redis, kind: cache}
  - {prefix: github.com/go-redis/redis, kind: cache}
  - {prefix: github.com/go-resty/resty, kind: http-out}
  - {prefix: net/http, kind: http}
  - {prefix: github.com/gin-gonic/gin, kind: http-in}
  - {prefix: github.com/labstack/echo, kind: http-in}
  - {prefix: github.com/go-chi/chi, kind: http-in}
  - {prefix: github.com/aws/aws-sdk-go-v2, kind: cloud-sdk}
  - {prefix: github.com/aws/aws-sdk-go, kind: cloud-sdk}
  - {prefix: cloud.google.com/go, kind: cloud-sdk}
  - {prefix: google.golang.org/grpc, kind: grpc}
  routes:
    # `mux.HandleFunc("GET /orders/{id}", h)`: the method is optional (none: ANY); the path starts with `/`
    - name: net-http
      when: net/http
      path: literal
      method: ANY
      regex: '\.(?:HandleFunc|Handle)\(\s*"(?:(?P<method>[A-Z]+)\s+)?(?P<path>/[^"\s]*)"\s*,(?:\s*(?:[\w.]+\(\s*)?(?P<handler>[\w.]+)\s*\)?\s*\))?'
    # `r.GET("/x", mw, h)`: the handler is the last argument when every argument is a name; `Any` is ANY
    - name: gin
      when: github.com/gin-gonic/gin
      path: literal
      method: ANY
      regex: '\b\w+\.(?:(?P<method>GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)|Any)\(\s*"(?P<path>[^"]*)"\s*,(?:\s*(?:[\w.]+\s*,\s*)*(?P<handler>[\w.]+)\s*\))?'
    - name: gin-group
      when: github.com/gin-gonic/gin
      path: literal
      mount: true
      regex: '\b\w+\.Group\(\s*"(?P<path>[^"]*)"'
    - name: echo
      when: github.com/labstack/echo
      path: literal
      method: ANY
      regex: '\b\w+\.(?:(?P<method>GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)|Any)\(\s*"(?P<path>[^"]*)"\s*,(?:\s*(?:[\w.]+\s*,\s*)*(?P<handler>[\w.]+)\s*\))?'
    - name: echo-group
      when: github.com/labstack/echo
      path: literal
      mount: true
      regex: '\b\w+\.Group\(\s*"(?P<path>[^"]*)"'
    - name: chi
      when: github.com/go-chi/chi
      path: literal
      regex: '\b\w+\.(?P<method>Get|Post|Put|Delete|Patch|Head|Options)\(\s*"(?P<path>/[^"]*)"\s*,(?:\s*(?:[\w.]+\s*,\s*)*(?P<handler>[\w.]+)\s*\))?'
    - name: chi-route
      when: github.com/go-chi/chi
      path: literal
      mount: true
      regex: '\.Route\(\s*"(?P<path>[^"]*)"'
    - name: chi-mount
      when: github.com/go-chi/chi
      path: literal
      mount: true
      regex: '\.Mount\(\s*"(?P<path>[^"]*)"\s*,\s*(?P<target>[\w.]+)'
  tables:
    - {name: gorm-table-name,
       regex: '\bfunc\s*\([^()]*\)\s*TableName\(\s*\)\s*string\s*\{\s*return\s+"(?P<table>[^"]+)"'}
  queues:
    - {name: go-channel, delivery: queue, regex: '\bmake\s*\(\s*chan\s+(?!struct\s*\{\s*\}|bool\b)'}
