# Built-in pack: what the scanner knows about Python libraries. Same format as stack.yaml; stack.yaml adds to it.
# imports: prefix -> resource kind, matched on dotted boundaries.
# Kinds: sql-db, doc-db, cache, http-in, http-out, http, ws, event, grpc, cloud-sdk,
# spark (DataFrame reads/writes: JDBC, Hudi/Delta/Parquet lakes; tables come from .option/.table calls)
# Rules kept in code because a pattern cannot express them: FastAPI router prefixes and include_router,
# Airflow DAGs, Flyte workflows and launch plans, gRPC and proto services.
# tables: SQLAlchemy (also through Flask-SQLAlchemy or SQLModel) `__tablename__ = "x"` and Django `db_table = "x"` (in the model's Meta), defined on the class.
# The standard library is ignored in code (sys.stdlib_module_names), not listed here.
# ignore: libraries the code rules above read (Airflow, Flyte), so they are not listed as unrecognised.
# routes: Flask `@x.route(path, methods=[..])` (GET when none), `@x.get(path)`... (Flask 2) and `add_url_rule`.
# queues: in-process queue creation sites (`asyncio.Queue` and `queue.Queue` (and their Priority/Lifo/Simple forms)): candidates the agent confirms (references/interactions.md).
python:
  ignore: [airflow, flytekit]
  imports:
  - {prefix: "smtplib", kind: mail}
  - {prefix: "flask_mail", kind: mail}
  - {prefix: "django.core.mail", kind: mail}
  - {prefix: "fastapi_mail", kind: mail}
  - {prefix: "aiosmtplib", kind: mail}
  - {prefix: "yagmail", kind: mail}
  - {prefix: psycopg, kind: sql-db}
  - {prefix: psycopg2, kind: sql-db}
  - {prefix: asyncpg, kind: sql-db}
  - {prefix: sqlalchemy, kind: sql-db}
  - {prefix: sqlmodel, kind: sql-db}
  - {prefix: sqlite3, kind: sql-db}
  - {prefix: pymssql, kind: sql-db}
  - {prefix: pymysql, kind: sql-db}
  - {prefix: mysql.connector, kind: sql-db}
  - {prefix: pyodbc, kind: sql-db}
  - {prefix: google.cloud.bigquery, kind: sql-db}
  - {prefix: pyspark, kind: spark}
  - {prefix: pymongo, kind: doc-db}
  - {prefix: motor, kind: doc-db}
  - {prefix: redis, kind: cache}
  - {prefix: requests, kind: http-out}
  - {prefix: httpx, kind: http-out}
  - {prefix: aiohttp, kind: http}
  - {prefix: urllib.request, kind: http-out}
  - {prefix: fastapi, kind: http-in}
  - {prefix: flask, kind: http-in}
  - {prefix: quart, kind: http-in}
  - {prefix: websockets, kind: ws}
  - {prefix: websocket, kind: ws}
  - {prefix: kafka, kind: event}
  - {prefix: confluent_kafka, kind: event}
  - {prefix: aiokafka, kind: event}
  - {prefix: pika, kind: event}
  - {prefix: aio_pika, kind: event}
  - {prefix: grpc, kind: grpc}
  - {prefix: boto3, kind: cloud-sdk}
  - {prefix: google.cloud.storage, kind: cloud-sdk}
  - {prefix: google.cloud.pubsub, kind: event}
  - {prefix: google.cloud.pubsub_v1, kind: event}
  routes:
    # `@bp.route("/x", methods=["POST"])` on the view below it; no `methods` is GET
    - name: flask
      when: flask
      path: literal
      method: GET
      regex: '@\w+\.route\(\s*[rRuU]?["''](?P<path>[^"'']*)["''](?:[^()]*?\bmethods\s*=\s*[\[(](?P<methods>[^\])]*)[\])])?'
    - name: flask-verb
      when: flask
      path: literal
      method: GET
      regex: '@\w+\.(?P<method>get|post|put|patch|delete)\(\s*[rRuU]?["''](?P<path>[^"'']*)["'']'
    # `bp.add_url_rule("/x", view_func=h, methods=[..])`, keywords in any order; `h.as_view("name")` is h
    - name: flask-url-rule
      when: flask
      path: literal
      method: GET
      regex: '\.add_url_rule\(\s*[rRuU]?["''](?P<path>[^"'']*)["''](?=(?:[^()]|\([^()]*\))*?\bview_func\s*=\s*(?P<handler>[A-Za-z_]\w*(?:\.(?!as_view\b)\w+)*))(?=(?:(?:[^()]|\([^()]*\))*?\bmethods\s*=\s*[\[(](?P<methods>[^\])]*)[\])])?)'
    # `add_url_rule("/x", "name", h)`: the view third, positional
    - name: flask-url-rule-positional
      when: flask
      path: literal
      method: GET
      regex: '\.add_url_rule\(\s*[rRuU]?["''](?P<path>[^"'']*)["'']\s*,\s*(?:["''][^"'']*["'']|None)\s*,\s*(?P<handler>[A-Za-z_]\w*(?:\.(?!as_view\b)\w+)*)(?![\w.]*\s*=)(?:\.as_view\([^()]*\))?(?=(?:(?:[^()]|\([^()]*\))*?\bmethods\s*=\s*[\[(](?P<methods>[^\])]*)[\])])?)'
  tables:
    - {name: sqlalchemy, when: sqlalchemy, regex: '\b__tablename__\s*=\s*["''](?P<table>[^"'']+)["'']'}
    - {name: flask-sqlalchemy, when: flask_sqlalchemy, regex: '\b__tablename__\s*=\s*["''](?P<table>[^"'']+)["'']'}
    - {name: sqlmodel, when: sqlmodel, regex: '\b__tablename__\s*=\s*["''](?P<table>[^"'']+)["'']'}
    - {name: django, when: django, regex: '\bdb_table\s*=\s*["''](?P<table>[^"'']+)["'']'}
  queues:
    - {name: asyncio-queue, when: asyncio, delivery: queue, regex: '\b(?:asyncio\.)?(?:Priority|Lifo)?Queue\s*\('}
    - {name: thread-queue, when: queue, delivery: queue, regex: '\b(?:queue\.)?(?:Simple|Priority|Lifo)?Queue\s*\('}
  jobs:
    # Celery: `@app.task` on the project's own app (no celery import in the file), `@shared_task`; `.delay`/`.apply_async`
    # on the task, `send_task("name")`, a beat entry's `"task": "name"`. RQ: `queue.enqueue(fn)`, `@job(..)` (often an app's own
    # wrapper, so no `when`). Dramatiq.
    - {name: celery-task, side: define, regex: '^[ \t]*@(?:(?!dag\.)\w+\.task|(?:celery\.)?shared_task)\b(?!\.)'}
    - {name: celery-enqueue, side: enqueue, regex: '(?<!self\.)(?<!cls\.)\b(?P<job>[A-Za-z_]\w*)\.(?:delay|apply_async)\('}
    - {name: celery-send-task, when: celery, side: enqueue, regex: '\.send_task\(\s*["''](?P<job>[\w.]+)["'']'}
    # a beat entry: its dict holds both "task" and "schedule"
    - {name: celery-beat, side: schedule, regex: '["'']task["'']\s*:\s*["''](?P<job>[\w.]+)["''](?=[^{}]*["'']schedule["''])'}
    - {name: celery-beat-after, side: schedule, regex: '["'']schedule["''][^{}]*?["'']task["'']\s*:\s*["''](?P<job>[\w.]+)["'']'}
    - {name: rq-enqueue, when: rq, side: enqueue, regex: '\.enqueue(?:_call|_in|_at)?\(\s*(?:f\s*=\s*)?(?P<job>[A-Za-z_][\w.]*)\s*[,)]'}
    - {name: rq-job, side: define, regex: '^[ \t]*@(?:\w+\.)*job\('}
    - {name: dramatiq-actor, when: dramatiq, side: define, regex: '^[ \t]*@(?:dramatiq\.)?actor\b'}
    - {name: dramatiq-send, when: dramatiq, side: enqueue, regex: '\b(?P<job>[A-Za-z_]\w*)\.send(?:_with_options)?\('}
